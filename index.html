<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>사진 보관함</title>
  <meta name="description" content="휴대폰과 PC의 사진·동영상을 갤러리처럼 보관하고, 백업 파일로 내보내고 복원하는 앱">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="사진 보관함">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css?v=3.0.1">
  <!-- 배포할 때마다 버전을 올려서, 새 버전과 옛 버전 파일이 섞여 불러와지지 않게 합니다. -->
  <script type="importmap">
  {
    "imports": {
      "./js/app.js": "./js/app.js?v=3.0.1",
      "./js/collage.js": "./js/collage.js?v=3.0.1",
      "./js/db.js": "./js/db.js?v=3.0.1",
      "./js/editor.js": "./js/editor.js?v=3.0.1",
      "./js/enhance.js": "./js/enhance.js?v=3.0.1",
      "./js/imaging.js": "./js/imaging.js?v=3.0.1",
      "./js/library.js": "./js/library.js?v=3.0.1",
      "./js/lock.js": "./js/lock.js?v=3.0.1",
      "./js/media.js": "./js/media.js?v=3.0.1",
      "./js/scroller.js": "./js/scroller.js?v=3.0.1",
      "./js/ui.js": "./js/ui.js?v=3.0.1",
      "./js/viewer.js": "./js/viewer.js?v=3.0.1",
      "./js/zip.js": "./js/zip.js?v=3.0.1"
    }
  }
  </script>
  <script>
    // 시작 안전장치: 앱이 시작하지 못하면 원인과 함께 '새로 불러오기' 버튼을 보여줍니다.
    (function () {
      var errors = [];
      var MODULES = ['app', 'collage', 'db', 'editor', 'enhance', 'imaging', 'library', 'lock', 'media', 'scroller', 'ui', 'viewer', 'zip'];
      function show() {
        if (window.__pvReady || document.getElementById('boot-error') || !document.body) return;
        var box = document.createElement('div');
        box.id = 'boot-error';
        box.setAttribute('role', 'alert');
        box.innerHTML = '<div><h2>앱을 불러오지 못했어요</h2>'
          + '<p>업데이트 직후 이전 파일이 남아 있거나 연결이 불안정할 때 생길 수 있어요. 보관한 사진은 그대로 있어요.</p>'
          + '<button type="button">새로 불러오기</button>'
          + '<small></small></div>';
        box.querySelector('small').textContent = errors.length ? '오류: ' + errors.slice(0, 3).join(' / ') : '시간 안에 시작하지 못했어요';
        document.body.appendChild(box);
        box.querySelector('button').onclick = function () {
          this.disabled = true;
          this.textContent = '불러오는 중…';
          var jobs = [];
          try {
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
            if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
            // 브라우저에 남은 이전 파일을 서버의 최신 파일로 바꿔 둡니다 (실제로 쓰는 버전 주소와 기본 주소 모두)
            var urls = MODULES.map(function (m) { return 'js/' + m + '.js'; });
            try {
              var map = JSON.parse(document.querySelector('script[type="importmap"]').textContent).imports;
              Object.keys(map).forEach(function (k) { urls.push(map[k]); });
            } catch (e) { /* 무시 */ }
            var entry = document.querySelector('script[type="module"][src]');
            if (entry) urls.push(entry.getAttribute('src'));
            urls.forEach(function (u) { jobs.push(fetch(u, { cache: 'reload' }).catch(function () {})); });
            jobs.push(fetch('index.html', { cache: 'reload' }).catch(function () {}));
          } catch (e) { /* 무시 */ }
          Promise.all(jobs).catch(function () {}).then(function () {
            location.replace(location.pathname + '?r=' + Date.now() + location.hash);
          });
        };
      }
      window.addEventListener('error', function (e) {
        if (window.__pvReady) return;
        errors.push(e.message || (e.target && (e.target.src || e.target.href)) || '알 수 없는 오류');
        setTimeout(show, 400);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (window.__pvReady) return;
        errors.push(String((e.reason && e.reason.message) || e.reason));
        setTimeout(show, 400);
      });
      setTimeout(show, 15000);
    })();
  </script>
  <script type="module" src="js/app.js?v=3.0.1"></script>
</head>
<body>
  <header id="appbar" class="appbar"></header>
  <main id="main" class="main"></main>
  <nav id="tabbar" class="tabbar" aria-label="메뉴"></nav>
  <div id="selbar" class="selbar" role="toolbar" aria-label="선택한 항목"></div>

  <input type="file" id="file-input" accept="image/*,video/*" multiple hidden>
  <input type="file" id="folder-input" webkitdirectory multiple hidden>
  <input type="file" id="zip-input" accept=".zip,application/zip,application/x-zip-compressed" multiple hidden>

  <div id="drop-overlay" class="drop-overlay" hidden>
    <div><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg><p>여기에 놓으면 보관함에 저장돼요</p></div>
  </div>
  <div id="progress" class="progress" hidden></div>
  <div id="viewer-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <noscript><p style="padding:24px">이 앱을 사용하려면 자바스크립트를 켜 주세요.</p></noscript>
</body>
</html>
